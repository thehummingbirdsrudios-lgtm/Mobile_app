name: vepari
description: "Vepari — B2B jewellery ordering, Hisaab and bills for veparis."
publish_to: none

# Semantic version + Android versionCode. Bump per release (see CHANGELOG.md).
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  supabase_flutter: ^2.18.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  meta: ^1.19.0
  image_picker: ^1.2.3
  image: ^4.10.1
  crypto: ^3.0.7
  cached_network_image: ^4.0.4
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  pdf: ^3.13.1
  path_provider: ^2.1.6
  record: ^7.1.1
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/legal/

  # Hind (Indian Type Foundry, SIL OFL 1.1) — one design family across
  # Latin, Gujarati and Devanagari so mixed-script text looks consistent.
  fonts:
    - family: HindVadodara
      fonts:
        - asset: assets/fonts/HindVadodara-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindVadodara-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindVadodara-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindVadodara-Bold.ttf
          weight: 700
    - family: Hind
      fonts:
        - asset: assets/fonts/Hind-Regular.ttf
          weight: 400
        - asset: assets/fonts/Hind-Medium.ttf
          weight: 500
        - asset: assets/fonts/Hind-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Hind-Bold.ttf
          weight: 700
