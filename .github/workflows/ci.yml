name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  app:
    name: App — format, analyze, boundaries, tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Module boundaries
        run: dart run tool/check_boundaries.dart

      - name: Tests
        run: flutter test

      - name: Legal texts in sync with docs/legal
        run: ../tool/sync_legal.sh --check

      - name: Build web
        run: flutter build web --release

      - name: Build Android (debug APK)
        run: flutter build apk --debug

      # Exercises R8 shrinking and the release manifest. Signed with the debug
      # key here (no key.properties in CI); the store build uses the real key.
      - name: Build Android (release APK)
        run: flutter build apk --release

  database:
    name: Database — migrations, RLS, money, isolation, scale
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4

      - name: DB tests (incl. 10k/5k/50k scale plans)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          VEPARI_PERF_BUDGET_FACTOR: '4'
        run: tool/db_test.sh --scale

  functions:
    name: Edge Functions — format, lint, type-check, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type-check entry points (locked dependencies)
        run: deno check --frozen */index.ts

      - name: Tests
        run: deno test --frozen

  dependencies:
    name: Dependencies — known vulnerabilities (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0

      # Dart lockfiles. The Edge Functions' deno.lock is not a format OSV
      # reads; its single npm dependency is pinned and reviewed by hand.
      - name: Scan lockfiles
        run: |
          "$(go env GOPATH)/bin/osv-scanner" scan source \
            --lockfile=app/pubspec.lock \
            --lockfile=backend_tests/pubspec.lock

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
